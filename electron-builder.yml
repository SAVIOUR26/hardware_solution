appId: com.thirdsan.hardwaremanager
productName: Hardware Manager Pro
copyright: Copyright © 2024 Thirdsan

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - electron/database/**/*.sql
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

publish:
  provider: github
  releaseType: release

extraMetadata:
  main: dist-electron/main.js
